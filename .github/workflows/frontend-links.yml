name: Links

on:
  workflow_call:
    inputs:
      runner:
        description: >-
          Runner label for the link check. Private repositories may pass a
          Blacksmith label; public repositories keep the GitHub-hosted default.
        type: string
        required: false
        default: "ubuntu-24.04-arm"

permissions:
  contents: read

jobs:
  links:
    name: Markdown links
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check relative links and anchors
        run: |
          set -euo pipefail
          files="$(git -c core.quotePath=false ls-files -- '*.md' '*.markdown' \
            ':(exclude,glob)**/node_modules/**' \
            ':(exclude,glob)**/vendor/**' \
            ':(exclude,glob)**/third_party/**' \
            ':(exclude,glob)**/Pods/**' \
            ':(exclude,glob)**/Carthage/**' \
            ':(exclude,attr:linguist-vendored)' \
            ':(exclude,attr:linguist-vendored=true)')"
          if [ -z "$files" ]; then
            echo "No tracked Markdown to check"
            exit 0
          fi
          printf '%s\n' "$files" | docker run --rm -i --network none -v "$PWD:/repo:ro" --workdir /repo \
            lycheeverse/lychee:0.24.2@sha256:e2d19e57cf6ab037026f20b8e449a1f30d9d7f81eef4194763aab2eab20bd28d \
            --offline --include-fragments --root-dir /repo --no-progress --files-from -
