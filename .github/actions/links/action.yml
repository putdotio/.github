name: Links
description: >-
  Offline check of relative links and heading anchors in tracked Markdown, run
  as a step of a caller's existing verify job on every event. Web links are
  not checked.
runs:
  using: composite
  steps:
    - name: Check Markdown links with lychee
      shell: bash
      run: |
        set -euo pipefail
        files="$(git -c core.quotePath=false ls-files -- '*.md' '*.markdown' \
          ':(exclude,glob)**/node_modules/**' \
          ':(exclude,glob)**/vendor/**' \
          ':(exclude,glob)**/third_party/**' \
          ':(exclude,glob)**/Pods/**' \
          ':(exclude,glob)**/Carthage/**' \
          ':(exclude,attr:linguist-vendored)' \
          ':(exclude,attr:linguist-vendored=true)')"
        if [ -z "$files" ]; then
          echo "links: no tracked Markdown"
          exit 0
        fi
        if [ "$RUNNER_OS" = Linux ]; then
          printf '%s\n' "$files" | docker run --rm -i --network none -v "$PWD:/repo:ro" --workdir /repo \
            lycheeverse/lychee:0.24.2@sha256:e2d19e57cf6ab037026f20b8e449a1f30d9d7f81eef4194763aab2eab20bd28d \
            --offline --include-fragments --root-dir /repo --no-progress --files-from -
        else
          lychee="$("$GITHUB_ACTION_PATH/../scan/install.sh" lychee \
            ARM64 lycheeverse/lychee@lychee-v0.24.2 'lychee-aarch64-apple-darwin.tar.gz' sha256:c9d3740ea2d891854d37116c9fba840f37b6e7c89d330e7db84ac333631c4977 \
            X64 lycheeverse/lychee@lychee-v0.24.2 'lychee-x86_64-apple-darwin.tar.gz' sha256:887503a9cff667d322b8d0892b40bf49976eb9507af8483220a3706cdad55978)"
          printf '%s\n' "$files" | "$lychee" --offline --include-fragments --root-dir "$PWD" --no-progress --files-from -
        fi
