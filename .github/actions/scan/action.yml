name: Scan
description: >-
  Push-time secret and workflow scan, run as the last steps of a caller's
  existing verify job. On push it scans the pushed range; on workflow_dispatch
  it scans full history; every other event passes through. Gitleaks runs on
  private repositories. Actionlint and Zizmor run when the range changes
  workflows, action metadata, or their configuration.
inputs:
  gitleaks:
    description: >-
      auto scans private repositories only; true or false forces it.
    required: false
    default: auto
  zizmor-args:
    description: >-
      Extra zizmor arguments for repositories with documented needs, e.g.
      --no-online-audits when a workflow pins a private first-party action
      whose tags the repository token cannot list.
    required: false
    default: ""
  token:
    description: >-
      Token used to deepen the caller's credential-less checkout and for
      Zizmor's online audits.
    required: false
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    - name: Select scan range
      id: plan
      shell: bash
      env:
        EVENT: ${{ github.event_name }}
        BEFORE: ${{ github.event.before }}
        PRIVATE: ${{ github.event.repository.private }}
        GITLEAKS: ${{ inputs.gitleaks }}
        TOKEN: ${{ inputs.token }}
      run: '"$GITHUB_ACTION_PATH/plan.sh"'
    - name: Scan secrets with Gitleaks
      if: ${{ steps.plan.outputs.gitleaks == 'true' }}
      shell: bash
      env:
        LOG_OPTS: ${{ steps.plan.outputs.log-opts }}
      run: |
        if [ "$RUNNER_OS" = Linux ]; then
          docker run --rm --network none -v "$PWD:/repo:ro" \
            zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --log-opts="$LOG_OPTS" --redact --no-banner --verbose
        else
          gitleaks="$("$GITHUB_ACTION_PATH/install.sh" gitleaks \
            ARM64 gitleaks/gitleaks@v8.30.1 'gitleaks_{version}_darwin_arm64.tar.gz' sha256:b40ab0ae55c505963e365f271a8d3846efbc170aa17f2607f13df610a9aeb6a5 \
            X64 gitleaks/gitleaks@v8.30.1 'gitleaks_{version}_darwin_x64.tar.gz' sha256:dfe101a4db2255fc85120ac7f3d25e4342c3c20cf749f2c20a18081af1952709)"
          "$gitleaks" git . --log-opts="$LOG_OPTS" --redact --no-banner --verbose
        fi
    - name: Lint workflows with Actionlint
      if: ${{ !cancelled() && steps.plan.outputs.workflows == 'true' }}
      shell: bash
      run: |
        if [ "$RUNNER_OS" = Linux ]; then
          docker run --rm --network none -v "$PWD:/repo:ro" --workdir /repo \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -color
        else
          shellcheck="$("$GITHUB_ACTION_PATH/install.sh" shellcheck \
            ARM64 koalaman/shellcheck@v0.11.0 'shellcheck-v{version}.darwin.aarch64.tar.xz' sha256:56affdd8de5527894dca6dc3d7e0a99a873b0f004d7aabc30ae407d3f48b0a79 \
            X64 koalaman/shellcheck@v0.11.0 'shellcheck-v{version}.darwin.x86_64.tar.xz' sha256:3c89db4edcab7cf1c27bff178882e0f6f27f7afdf54e859fa041fca10febe4c6)"
          actionlint="$("$GITHUB_ACTION_PATH/install.sh" actionlint \
            ARM64 rhysd/actionlint@v1.7.12 'actionlint_{version}_darwin_arm64.tar.gz' sha256:aba9ced2dee8d27fecca3dc7feb1a7f9a52caefa1eb46f3271ea66b6e0e6953f \
            X64 rhysd/actionlint@v1.7.12 'actionlint_{version}_darwin_amd64.tar.gz' sha256:5b44c3bc2255115c9b69e30efc0fecdf498fdb63c5d58e17084fd5f16324c644)"
          pyflakes="$RUNNER_TEMP/pyflakes"
          git init -q "$pyflakes"
          git -C "$pyflakes" fetch -q --depth 1 https://github.com/PyCQA/pyflakes 59ec4593efd4c69ce00fdb13c40fcf5f3212ab10 # 3.4.0
          git -C "$pyflakes" checkout -q FETCH_HEAD
          export PYTHONPATH="$pyflakes"
          version="$(python3 "$pyflakes/bin/pyflakes" --version)"
          echo "pyflakes: PyCQA/pyflakes $version, commit $(git -C "$pyflakes" rev-parse HEAD)" >&2
          "$actionlint" -color -shellcheck="$shellcheck" -pyflakes="python3 '$pyflakes/bin/pyflakes'"
        fi
    - name: Audit workflows with Zizmor
      if: ${{ !cancelled() && steps.plan.outputs.workflows == 'true' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        ZIZMOR_ARGS: ${{ inputs.zizmor-args }}
      run: |
        set -f
        # shellcheck disable=SC2086
        if [ "$RUNNER_OS" = Linux ]; then
          docker run --rm -e GH_TOKEN -v "$PWD:/repo:ro" \
            ghcr.io/zizmorcore/zizmor:1.30.1@sha256:a2eb396d886c053073405c7a980f2139ba2248ec172243cfa3841e57196e8101 \
            $ZIZMOR_ARGS /repo
        else
          zizmor="$("$GITHUB_ACTION_PATH/install.sh" zizmor \
            ARM64 zizmorcore/zizmor@v1.30.1 'zizmor-aarch64-apple-darwin.tar.gz' sha256:e28d22b087f9ebb8d99da6e740d348c930f559961c7c3f12badda54f882195a2 \
            X64 zizmorcore/zizmor@v1.30.1 'zizmor-x86_64-apple-darwin.tar.gz' sha256:10e6b18b11ea07e515a16f0f0518c7b07527bc9977c1fd5698181ce7f3554202)"
          "$zizmor" $ZIZMOR_ARGS .
        fi
