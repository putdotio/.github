name: Beta notes
description: >-
  Tester notes for a beta build. Claude reads the pull requests and code changed since a base build, such as
  the last store release, and writes short bullets. A range with no
  user-facing commits, or any Claude failure, gives the fallback, so a beta
  never waits on it.
inputs:
  app:
    description: App name Claude writes for, e.g. put.io for Apple TV.
    required: true
  base:
    description: Ref of the base build. Wins over tag-pattern.
    required: false
    default: ""
  tag-pattern:
    description: >-
      git describe --match glob for the base build's tag, e.g. the release tag
      apple-tv-v*. Needs a checkout with fetch-depth: 0.
    required: false
    default: ""
  max-length:
    description: Store limit in characters; bullets past it are dropped. Google Play allows 500.
    required: false
    default: "4000"
  fallback:
    description: Notes when there is nothing to say or Claude fails.
    required: false
    default: Bug fixes and improvements.
  model:
    description: Claude model.
    required: false
    default: claude-opus-5-5
  max-turns:
    description: Upper bound on Claude's tool calls.
    required: false
    default: "40"
  anthropic-federation-rule-id:
    description: Workload identity federation rule (fdrl_...); needs id-token write on the job. Defaults to put.io's rule, which trusts main of putdotio repositories.
    required: false
    default: fdrl_0163Ae8fnpTVfnEetnsCiGuG
  anthropic-organization-id:
    description: Anthropic organization UUID for workload identity federation.
    required: false
    default: 2e584ae4-19cb-48ff-82bf-7b8d0506f8e6
  anthropic-service-account-id:
    description: Service account (svac_...) the federated token acts as.
    required: false
    default: svac_01NKncFUgmevWDAY6kExgK63
  anthropic-workspace-id:
    description: Workspace (wrkspc_...) the federated token acts in.
    required: false
    default: wrkspc_01X5KGoAA1MuzqQqCaiTWLyv
  anthropic-api-key:
    description: Static key, only when federation is not set up; it takes precedence over federation.
    required: false
    default: ""
  token:
    description: Token Claude uses to read pull requests; needs pull-requests read.
    required: false
    default: ${{ github.token }}
outputs:
  notes:
    description: Notes as one bullet per line, or the fallback.
    value: ${{ steps.finish.outputs.notes }}
  source:
    description: claude or fallback.
    value: ${{ steps.finish.outputs.source }}
runs:
  using: composite
  steps:
    - name: Select the range since the base build
      id: plan
      shell: bash
      env:
        APP: ${{ inputs.app }}
        BASE_REF: ${{ inputs.base }}
        TAG_PATTERN: ${{ inputs.tag-pattern }}
        RESULT: ${{ runner.temp }}/beta-notes-result.json
      run: '"$GITHUB_ACTION_PATH/plan.sh"'
    - name: Write notes with Claude
      id: claude
      if: steps.plan.outputs.run == 'true'
      continue-on-error: true
      shell: bash
      env:
        PROMPT: ${{ steps.plan.outputs.prompt }}
        RESULT: ${{ runner.temp }}/beta-notes-result.json
        MODEL: ${{ inputs.model }}
        MAX_TURNS: ${{ inputs.max-turns }}
        GH_TOKEN: ${{ inputs.token }}
        ANTHROPIC_FEDERATION_RULE_ID: ${{ inputs.anthropic-federation-rule-id }}
        ANTHROPIC_ORGANIZATION_ID: ${{ inputs.anthropic-organization-id }}
        ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ inputs.anthropic-service-account-id }}
        ANTHROPIC_WORKSPACE_ID: ${{ inputs.anthropic-workspace-id }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
      run: '"$GITHUB_ACTION_PATH/claude.sh"'
    - name: Fit the notes to the store
      id: finish
      shell: bash
      env:
        RESULT: ${{ runner.temp }}/beta-notes-result.json
        MAX_LENGTH: ${{ inputs.max-length }}
        FALLBACK: ${{ inputs.fallback }}
      run: '"$GITHUB_ACTION_PATH/finish.sh"'
